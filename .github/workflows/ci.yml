name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Temporary bootstrap after adding Supabase SSR: commit the refreshed lockfile from the real branch.
      - name: Update package lock
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/academic-core-and-pyq'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git fetch origin "${BRANCH_NAME}"
          git switch -C "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Package lock unchanged."
          else
            git commit -m "build: update npm lockfile for Supabase Auth"
            git push origin "${BRANCH_NAME}"
          fi
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jiit_toppers?schema=public
      - run: npm run build
