name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The repository currently has no committed package-lock.json, so npm ci
      # and setup-node's lockfile-based cache cannot run yet. Keep CI executable
      # while the lockfile is generated in a Node-enabled environment.
      - run: npm install --no-audit --no-fund
      # Temporary bootstrap: commit the generated lockfile once on the implementation branch.
      # This step is removed after package-lock.json exists in Git.
      - name: Bootstrap package lock
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/academic-core-and-pyq'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git fetch origin "${BRANCH_NAME}"
          git switch -C "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Package lock unchanged."
          else
            git commit -m "build: commit generated npm lockfile"
            git push origin "${BRANCH_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jiit_toppers?schema=public
      - run: npm run build
