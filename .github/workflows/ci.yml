name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The repository currently has no committed package-lock.json, so npm ci
      # and setup-node's lockfile-based cache cannot run yet. Keep CI executable
      # while the lockfile is generated in a Node-enabled environment.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jiit_toppers?schema=public
      - run: npm run build
